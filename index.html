<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HEMT Physical Media Labels</title>    
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="labels-wrapper">
        
        <!-- LABEL 1 -->
        <div class="label-container">
            <div class="header">
                HEMT 1: LNF-LNC0.3_14A s/n 2142Z
            </div>
            <div class="table-section">
                <table class="data-table">
                    <thead>
                        <tr class="border-bottom">
                            <th></th>
                            <th>296 K</th>
                            <th>4 K</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>V<sub>d</sub></td>
                            <td>1.80 V</td>
                            <td>1.30 V</td>
                        </tr>
                        <tr>
                            <td>I<sub>d</sub></td>
                            <td>50 mA</td>
                            <td>26 mA</td>
                        </tr>
                        <tr class="border-bottom">
                            <td>V<sub>g</sub></td>
                            <td>-1.33 V</td>
                            <td>-1.41 V</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="qr-section">
                <div id="qrcode1" class="qr-container"></div>
            </div>
        </div>

        <!-- LABEL 2 (Modify values here as needed) -->
        <div class="label-container">
            <div class="header">
                HEMT 2: LNF-LNC0.3_14A s/n 2054Z
            </div>
            <div class="table-section">
                <table class="data-table">
                    <thead>
                        <tr class="border-bottom">
                            <th></th>
                            <th>296 K</th>
                            <th>4 K</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>V<sub>d</sub></td>
                            <td>1.80 V</td>
                            <td>1.30 V</td>
                        </tr>
                        <tr>
                            <td>I<sub>d</sub></td>
                            <td>50 mA</td>
                            <td>26 mA</td>
                        </tr>
                        <tr class="border-bottom">
                            <td>V<sub>g</sub></td>
                            <td>-1.38 V</td>
                            <td>-1.48 V</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="qr-section">
                <div id="qrcode2" class="qr-container"></div>
            </div>
        </div>

    </div>

    <script>
        var codesquaresize = 150; 
        
        // Generate QR Code 1
        new QRCode(document.getElementById("qrcode1"), {
            text: "https://www.lownoisefactory.com/datasheets/LNF-LNC0.3_14A_sn2142Z.pdf",
            width: codesquaresize,
            height: codesquaresize,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        new QRCode(document.getElementById("qrcode2"), {
            text: "https://www.lownoisefactory.com/datasheets/LNF-LNC0.3_14A_sn2054Z.pdf",
            width: codesquaresize,
            height: codesquaresize,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
    
<style>
body {
    margin: 0;
    padding: 20px; 
    background-color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
}

.labels-wrapper {
    display: flex;
    flex-direction: row;
    gap: 20mm; 
}

.label-container {
    width: 70mm;
    box-sizing: border-box;
    padding: 4mm 2mm 4mm 4mm;
    background: #ffffff;
    color: #111111;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    border: 1px dotted #aaaaaa; 
}

.header {
    width: 100%;
    font-size: 10.5pt; 
    font-weight: bold;
    letter-spacing: 0.1px;
    margin-bottom: 2.5mm; 
    white-space: nowrap;
    line-height: 1.3;
}

.table-section {
    width: 58%;
    display: flex;
    flex-direction: column;
}

.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 9.5pt;
}

.data-table th, .data-table td {
    padding: 4px 2px; 
    text-align: right;
    vertical-align: middle;
}

.data-table th:first-child, 
.data-table td:first-child {
    text-align: left;
    font-weight: bold;
    width: 20%;
    padding-left: 0;
}

.data-table th {
    font-weight: normal;
}

.border-bottom {
    border-bottom: 1px solid #111111;
}

.qr-section {
    width: 42%;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    box-sizing: border-box;
}

.qr-container img, .qr-container canvas {
    width: 23mm !important;
    height: 23mm !important;
    display: block;
}

@media print {
    body {
        background: none;
        padding: 0;
    }
    .label-container {
        box-shadow: none;
        page-break-inside: avoid;
    }
}



    </style>    
</body>
</html>
